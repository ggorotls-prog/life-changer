function rpc(fn, args) {
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  }).then(r => r.json().then(j => {
    if (!r.ok) {
      if (j.message === 'auth') { logout(true); throw new Error('다시 로그인해 주세요.'); }
      throw new Error(j.message || r.status);
    }
    return j;
  }));
}

/* ===== 공통 ===== */
function md(ymd) { const p = ymd.split('-'); return (+p[1]) + '/' + (+p[2]); }
function addDays(ymd, n) {
  const p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.toISOString().slice(0, 10);
}
function sundayOf(d) { return addDays(d, -new Date(d + 'T00:00:00Z').getUTCDay()); }
const wd = d => '일월화수목금토'[new Date(d + 'T00:00:00Z').getUTCDay()];
const two = (l, s) => '<span class="l">' + l + '</span><span class="s">' + s + '</span>';
function urlBox(url, note) {
  return `<div class="url"><input readonly value="${esc(url)}"><button data-copy="${esc(url)}">복사</button></div>${note ? '<p class="sub">' + note + '</p>' : ''}`;
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-copy]');
  if (!b) return;
  const done = () => { b.textContent = '복사됨 ✓'; setTimeout(() => b.textContent = '복사', 1500); };
  (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copy) : Promise.reject()).then(done).catch(() => { b.previousElementSibling.select(); document.execCommand('copy'); done(); });
});
function backBtn() { return '<button class="back" onclick="location.hash=\'\'">◀ 내 방 목록</button>'; }

/* ===== 1단계 상세: 운동방 (옛 히어로 관리자 화면) ===== */
let room = null; // { id, name }
function getWeek(weekStart, rm) {
  rm = rm || room;
  const guess = weekStart || sundayOf(new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }));
  return call('lc_room_data', { p_room: rm.id, p_from: addDays(guess, -49), p_to: addDays(guess, 6) }).then(d => {
    rm.name = d.room.name;
    const start = weekStart || sundayOf(d.today);
    const days = [...Array(7)].map((_, i) => addDays(start, i));
    const changes = {};
    d.changes.forEach(c => (changes[c.name] = changes[c.name] || []).push(c));
    const why = {}; // 이 주 휴무 사유 (이름 → 사유)
    const goalFor = (m, wk) => {
      let g = m.goal, off = false;
      (changes[m.name] || []).forEach(c => {
        if (c.from > wk) return;
        if (c.goal === 0) { if (c.from === wk) { off = true; if (wk === start) why[m.name] = c.reason || ''; } }
        else { g = c.goal; if (c.from === wk) off = false; }
      });
      return off ? 0 : g;
    };
    const done = {};
    d.records.forEach(([name, date]) => { if (date >= days[0] && date <= days[6]) (done[name] = done[name] || {})[date] = true; });
    const members = d.members.map(m => ({ name: m.name, goal: goalFor(m, start) }));
    members.forEach(m => { if (!m.goal) m.why = why[m.name] || ''; });
    return { name: d.room.name, today: d.today, weekStart: start, days, members, done, all: d.all, rounds: d.rounds, next: nextInfo(d) };
  });
}
function nextInfo(d) {
  const r = d.rounds.filter(x => x.start <= d.today).pop();
  if (!r || d.today < sundayOf(r.end)) return null;
  const n = parseInt(r.name, 10), choices = {};
  (d.nextChoices || []).forEach(c => { if (c.round === r.name) choices[c.name] = c.choice; });
  return { round: r.name, label: n ? (n % 12 + 1) + '월' : '다음 달', choices };
}
function tableHtml(w) {

          '<col class="c-rest"></colgroup><thead><tr class="title"><td colspan="' + (w.days.length + 3) +
          '">💪 ' + esc(w.name || room.name) + ' 운동 챌린지</td></tr><tr><th>' + two('참가자', '이름') + '</th><th>결단</th>';
  w.days.forEach(d => h += '<th class="' + (d === w.today ? 'today' : '') + '">' + two(md(d), (+d.slice(8)) + '<small>' + wd(d) + '</small>') + '</th>');
  h += '<th>' + two('남은 횟수', '남은') + '</th></tr></thead><tbody>';
  w.members.forEach(m => {

      .then(([c, w]) => {
        alive(); const url = c.toDataURL('image/png');
        return toFile(c, w.name + '운동챌린지_' + md(w.days[0]).replace('/', '-') + '.png').then(file => { sendFiles[r.id] = { file, url }; ready(r.id); });
      }).catch(broke(r.id));
  });
  p.catch(() => {});
}

/* 방 상세: 보고 있는 주의 운동표 한 장(지난주 표도) */
let shotFile = null, shotUrl = '', shotJob = null;
function makeShot() {
  shotFile = null;
  $('shotArea').innerHTML = tableHtml(state);
  const w = state;
  const job = shotJob = shoot($('shotArea'), TABLE_OPT)
    .then(c => { shotUrl = c.toDataURL('image/png'); return toFile(c, w.name + '운동챌린지_' + md(w.days[0]).replace('/', '-') + '.png'); })
    .then(f => { if (job === shotJob) shotFile = f; });
  return job;
}
function saveShot() {
  const btn = $('save'), w = state;
  if (shotFile) return shareOne(shotFile, shotUrl).then(ok => {
    if (!ok) return;
    if (w.days.includes(w.today)) markSent(w.today, room.id);
    showMsg('ok', '✅ 운동표를 보냈어요.');
  });
  // 아직 만드는 중이면 끝난 뒤 한 번 더 누르게
  btn.disabled = true; btn.textContent = '이미지 준비 중…';
  (shotJob || makeShot()).then(() => { btn.disabled = false; btn.textContent = '📤 이 운동표 카톡으로 보내기'; showMsg('ok', '준비됐어요. 한 번 더 눌러 주세요.'); });
}
$('close').onclick = () => $('modal').classList.remove('show');
$('pvNo').onclick = () => $('pv').classList.remove('show');

/* ===== 2단계 상세: 건강 기록 그 조 화면 ===== */
const FACES = ['😫', '😐', '😄'];
const hm = t => t ? String(t).slice(0, 5) : '-';
/* 끼니 체크: 아·점·저 중 먹은 끼니만 초록(사진·글은 안 보임, 2026-11-20 룡) */
function mealChk(r) {
  if (!r.meals) return r.diet ? '✅' : '-';
  return `<span class="mchk">${[['breakfast', '아'], ['lunch', '점'], ['dinner', '저']].map(([k, n]) => `<span class="${r.meals.includes(k) ? 'y' : ''}">${n}</span>`).join('')}</span>`;
}
function recordTable(rows) {
  /* 3단계 캠프 조: 영양제 체크(카드 9장 시간표 5칸 중 몇 번, 2026-11-22)가 있으면 칸을 더 보인다(2026-11-20). 긴급 해제는 본인만 봐서 칸이 없다 */
  const eve = (rows || []).some(r => r.supps > 0);
  return `<div class="scroll"><table class="tbl2"><tr><th>날짜</th><th>기상</th><th>취침</th><th>컨디션</th><th>운동</th><th>식단</th>${eve ? '<th>영양제</th>' : ''}</tr>
    ${(rows || []).map(r => `<tr><td>${r.day.slice(5).replace('-', '/')}</td><td>${hm(r.wake)}</td><td>${hm(r.bed)}</td>
      <td>${r.condition ? FACES[r.condition - 1] : '-'}${r.condition_note ? `<span class="why2">${esc(r.condition_note)}</span>` : ''}</td><td>${r.exercise ? '✅' : '-'}</td><td>${mealChk(r)}</td>${eve ? `<td>${r.supps ? r.supps + '/5' : '-'}</td>` : ''}</tr>`).join('')}</table></div>`;
}
/* 조원 한 장: 최근 7일 요약 4칸 + 최근 피드백 + 표(펼치기) */
function avgHM(list) {
  if (!list.length) return '-';
  const v = Math.round(list.reduce((a, c) => a + c, 0) / list.length) % 1440;
  return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
}
const toM = t => { if (!t) return null; const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
/* 컨디션 이모티콘을 누르면 그 날짜와 이유가 펼쳐진다(2026-11-22 룡) */
function condWhy(btn) {
  const box = btn.closest('.mem').querySelector('.mem-why'), on = box.dataset.v === btn.dataset.v && !box.hidden;
  box.hidden = on; box.dataset.v = btn.dataset.v;
  if (!on) box.innerHTML = btn.dataset.list ? decodeURIComponent(btn.dataset.list) : '<span class="sub">이 컨디션인 날이 없어요.</span>';
}
function memberCard(m) {
  const all = m.records || [], w = all.slice(0, 7), byDay = Object.fromEntries(all.map(r => [r.day, r]));
  const wake = avgHM(w.map(r => toM(r.wake)).filter(x => x != null));
  /* 취침은 정오 전이면 다음 날로 쳐서 평균(새벽 1시 = 25시). 잠 = 전날 취침 → 그날 기상(건강 기록 「내 기록」과 같은 셈) */
  const bed = avgHM(w.map(r => toM(r.bed)).filter(x => x != null).map(x => x < 720 ? x + 1440 : x));
  const sleep = w.map(r => {
    const prev = new Date(r.day + 'T00:00:00Z'); prev.setUTCDate(prev.getUTCDate() - 1);
    const p = byDay[prev.toISOString().slice(0, 10)], b = p ? toM(p.bed) : null, k = toM(r.wake);
    return b == null || k == null ? null : (k + 1440 - b) % 1440;
  }).filter(x => x != null && x > 0);
  const sl = sleep.length ? Math.round(sleep.reduce((a, c) => a + c, 0) / sleep.length) : null;
  const ex = w.filter(r => r.exercise).length;
  /* 끼니 숫자(n/21)는 올린 것만 세서 뺌, 다른 방법을 찾을 때까지(2026-11-22 룡). 날짜별 표의 아·점·저 체크는 남김 */
  const condBtn = v => {
    const rows = w.filter(r => r.condition === v);
    const list = rows.map(r => `<div>${r.day.slice(5).replace('-', '/')} ${FACES[v - 1]} ${r.condition_note ? esc(r.condition_note) : '<span class="sub">이유 없음</span>'}</div>`).join('');
    return `<button type="button" class="cbtn" data-v="${v}" data-list="${encodeURIComponent(list)}" onclick="condWhy(this)">${FACES[v - 1]}${rows.length}</button>`;
  };
  const fb = (m.feedback || [])[0];
  return `<div class="mem"><div class="mem-h"><b>${esc(m.nickname)}${m.leader ? ' ⭐' : ''}${m.plan ? ` <small style="font-weight:600;color:#c9822b">💊${m.plan}안</small>` : ''}</b><span><small>최근 7일</small> <button type="button" data-kick="${esc(m.nickname)}" style="font-size:12px;padding:4px 8px;margin-left:6px">내보내기</button></span></div>
    <div class="mem-sum">
      <div><small>평균 수면</small><b class="slp">${sl != null ? Math.floor(sl / 60) + '시간 ' + (sl % 60) + '분' : '-'}</b><small>기상 ${wake} · 취침 ${bed}</small></div>
      <div><small>운동</small><b>${ex}/${m.goal || '-'}일</b></div>
      <div><small>컨디션 · 눌러 보기</small><b class="cbtns">${condBtn(3)}${condBtn(2)}${condBtn(1)}</b></div>
    </div>
    <div class="mem-why" hidden></div>
    ${fb ? `<div class="mem-fb"><small>📌 스스로 정한 적용점 · ${esc(fb.at)}</small><br>${esc(fb.note)}</div>` : ''}
    <details><summary>날짜별 표 보기 (2주)</summary>${recordTable(m.records)}</details></div>`;
}
function loadGroup(id) {
  return call('lc_group', { p_group: +id }).then(g => {
    $('app').innerHTML = backBtn() + `
      <div class="card"><h2>🌱 ${esc(g.name)} <span class="sub">${STAGE[2]}</span>${renameBtn()}</h2>
        <h3 style="margin-top:4px">👥 조원 ${g.members.length}명 <span class="sub">여기 내용은 다른 곳에 옮기지 않아요</span></h3>
        ${g.members.map(memberCard).join('') || '<p class="sub">아직 조원이 없어요. 아래에서 초대 코드를 만들어 보내 주세요.</p>'}</div>
      <div class="card"><details class="invbox"${g.members.length ? '' : ' open'}><summary>🎟 조원 초대하기 · 코드 ${esc(g.code || '-')}</summary>
        <label style="margin-top:10px">조원 초대 코드 (이 조는 늘 이 코드 하나 · 여러 명이 써도 돼요)</label>
        <div class="who-row"><span class="code">${esc(g.code || '-')}</span><span><button data-copy="${esc(g.code || '')}">복사</button> <button id="newCode">새 코드로 바꾸기</button></span></div>
        <p class="sub">새 코드로 바꾸면 옛 코드로는 더 못 들어와요. 이미 들어온 사람은 그대로예요.</p>
        <label style="margin-top:10px">참가자 주소 (건강 기록 · 앱도 같음)</label>${urlBox(LIFE_URL)}
        <h3>⭐ 리더 초대 (한 번 쓰는 코드)</h3>
        ${g.invites.map(i => `<div class="who-row"><span class="code">${esc(i.code)}</span><span>리더용 <button data-copy="${esc(i.code)}">복사</button></span></div>`).join('') || '<p class="sub">남은 리더 코드가 없어요.</p>'}
        <div class="bar" style="margin-top:8px"><button id="invL">➕ 리더 초대 코드</button></div>
        <p class="sub">새 사람은 주소에서 「초대 코드로 가입하기」 → 초대 코드 + 닉네임 + 비밀번호로 들어와요.</p></details></div>`;
    const inv = leader => call('lc_group_invite', { p_group: +id, p_leader: leader }).then(r => { showMsg('ok', '초대 코드 ' + r.code + ' 를 만들었어요.'); return loadGroup(id); }).catch(fail);
    $('newCode').onclick = () => {
      const b = $('newCode');
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '정말 바꾸기'; return; }
      call('lc_group_new_code', { p_group: +id }).then(r => { showMsg('ok', '새 초대 코드 ' + r.code + ' 로 바꿨어요.'); return loadGroup(id); }).catch(fail);
    };
    /* 잘못 들어온 사람 내보내기(2026-11-20 룡): 조에서만 빠지고 계정·기록은 본인에게 남는다 */
    $('app').querySelectorAll('[data-kick]').forEach(b => b.onclick = () => {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '정말 내보내기'; return; }
      b.disabled = true;
      call('lc_group_kick', { p_group: +id, p_nick: b.dataset.kick }).then(() => { showMsg('ok', b.dataset.kick + '님을 조에서 내보냈어요.'); return loadGroup(id); }).catch(e => { b.disabled = false; fail(e); });
    });
    $('invL').onclick = () => inv(true);
    bindRename('group', id, g.name, () => loadGroup(id));
  });
}

/* ===== 길 찾기 (#room=… / #group=…) ===== */
function route() {
  if (!token) return renderLogin();
  showMsg('', '');
  const h = location.hash.slice(1), m = h.match(/^(room|group)=(.+)$/);
  window.scrollTo(0, 0);
  const fresh = !home, ready = home ? Promise.resolve(home) : loadHome();
  ready.then(() => {
    if (!m) { $('app').innerHTML = '<p class="hint">불러오는 중…</p>'; return (fresh ? Promise.resolve() : loadHome()).then(renderHome); }
    $('app').innerHTML = backBtn() + '<p class="hint">불러오는 중…</p>';
    if (m[1] === 'room') { room = { id: decodeURIComponent(m[2]), name: '' }; return loadRoom(); }
    return loadGroup(decodeURIComponent(m[2]));
  }).catch(e => { if (token) { $('app').innerHTML = backBtn(); fail(e); } });
}
window.onhashchange = route;
route();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
